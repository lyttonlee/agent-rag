# =============================================================================
# 企业公文知识库 · 前端 nginx 配置模板
# 占位符 __BACKEND_UPSTREAM__ 由 entrypoint.sh 用环境变量 BACKEND_UPSTREAM 替换
# （默认 http://backend:8000，即 compose 中的后端服务名）
#
# 关键点：
#   1) /v1/ 反代必须关闭缓冲（proxy_buffering off）——起草/深度问答走 SSE 流式，
#      缓冲会导致事件分批延迟到达，前端表现为"卡住不动"
#   2) SPA history 路由回退 index.html
#   3) 上传体积放宽到 64m（文档上传 + 20MB 参考文档上传的余量）
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（对齐后端 20MB 参考文档上限，预留余量）
    client_max_body_size 64m;

    # 前端健康探针（仅说明 nginx 存活；后端连通性由后端 /health 负责）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- 后端 API / SSE 反代 ----
    location /v1/ {
        proxy_pass __BACKEND_UPSTREAM__;
        proxy_http_version 1.1;

        # 关闭一切缓冲与缓存：SSE 流式（起草/深度问答/入库进度）逐事件透传
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：模型逐轮决策最慢档 deep 180s，预留 1 小时防中间链路掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE 响应不做 gzip（gzip 会缓冲分块，破坏流式 flush）
        gzip off;
    }

    # ---- 静态资源：hash 文件名长效缓存 ----
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA  history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
