# =============================================================================
# Alembic configuration
# Database migration management. In production run `alembic upgrade head`
# to init/upgrade schema. Dev/Test uses app.main lifespan auto create_all.
#
# The real DB URL is injected by alembic/env.py from app.core.config.
# This sqlalchemy.url is only a placeholder, overridden at runtime.
# NOTE: keep this file ASCII-only (configparser on Windows reads as GBK).
# =============================================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://rag:rag123456@127.0.0.1:5432/gov_doc_rag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
